name: Theme CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: theme-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate theme
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'renovate/')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Set candidate identity
        id: candidate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            theme_name="ndawn-pr-${{ github.event.number }}-${GITHUB_SHA::12}"
          else
            theme_name="ndawn-${GITHUB_SHA::12}"
          fi
          echo "THEME_NAME=$theme_name" >> "$GITHUB_ENV"
          echo "FINAL_ZIP=dist/$theme_name.zip" >> "$GITHUB_ENV"
          echo "theme_name=$theme_name" >> "$GITHUB_OUTPUT"
          echo "final_zip=dist/$theme_name.zip" >> "$GITHUB_OUTPUT"

      # Workflow-only changes validate CI itself without creating a Ghost candidate.
      - name: Detect upload-relevant changes
        id: theme_changes
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi
          if git diff --quiet "$before" "$GITHUB_SHA" -- \
            '*.hbs' \
            'partials/**/*.hbs' \
            'members/**/*.hbs' \
            'assets/**' \
            'locales/**' \
            'package.json' \
            'yarn.lock' \
            'gulpfile.js' \
            '.nvmrc' \
            'scripts/ci/**' \
            'LICENSE' \
            'ads.txt' \
            'favicon*.ico'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/home.js
          node --check assets/js/post.js

      - name: Validate source theme
        run: yarn test:ci

      - name: Build and validate theme package
        run: |
          yarn zip
          yarn test:zip:ci

      - name: Check generated assets and diff
        run: |
          git diff --exit-code -- assets/built
          git diff --check

      - name: Upload inactive Ghost theme candidate
        if: github.event_name == 'push' && steps.theme_changes.outputs.changed == 'true'
        uses: TryGhost/action-deploy-theme@v2
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          file: ${{ steps.candidate.outputs.final_zip }}
